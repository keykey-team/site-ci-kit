# Приклад .github/workflows/ci.yml у репозиторії сайту (06638; v3 — 07385).
# Перевірки в PR: «ci / lint», «ci / unit», «ci / integration», «ci / build» —
# їх роблять обов'язковими в правилах гілки develop (README, «Обязательные проверки»).
# Що перевіряти на яку правку — .github/site-ci-areas.config.mjs сайту
# (приклад — examples/site-ci-areas.config.mjs).
name: CI

# Лише PR: push у develop/main перевіряє сам деплой, і лише те, чого PR не
# перевіряв (те саме дерево файлів удруге не перевіряється).
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

# Новий push у той самий PR скасовує застарілий прогін — у черзі лише актуальний код.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ім'я job — перша частина імені перевірки («ci / lint»). Не перейменовуйте
  # без оновлення правил гілки: старі обов'язкові перевірки чекатимуть вічно.
  ci:
    uses: keykey-team/site-ci-kit/.github/workflows/ci.yml@v3.1.0
    # statuses: write — відмітка «дерево перевірене»; pull-requests: read —
    # план шукає PR, яким прийшов коміт.
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    with:
      # Сайт на своєму раннері (немає хвилин GitHub-hosted):
      # runner-labels: '["sana-tests"]'
      node-version: "22"
