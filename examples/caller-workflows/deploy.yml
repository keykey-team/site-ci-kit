# Приклад .github/workflows/deploy.yml у репозиторії сайту (06638; v3 — 07385).
#
#   push develop → checks (лише те, чого PR не перевіряв) → deploy на stage →
#                  smoke stage (статус stage-smoke — сигнал, не замок)
#                  └─ PR з міткою «в прод» → release-to-prod: develop → main
#   push main    → checks → deploy на прод → smoke prod (лише @prod-safe)
#
# Гейту stage-smoke з v3 немає: прод не чекає stage.
name: Deploy

on:
  push:
    branches: [develop, main]
  # Потрібен release-to-prod: злиття токеном GitHub Actions push не породжує,
  # тож деплой main він запускає сам.
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Те саме дерево файлів, що пройшло CI в PR, тут не перевіряється вдруге.
  checks:
    uses: keykey-team/site-ci-kit/.github/workflows/ci.yml@v3.3.0
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    with:
      checks: unit integration
      # Свої раннери перевірок: plan і record — на раннері деплою, щоб деплой не
      # чекав, поки ті звільняться від CI інших PR. Код тут уже злитий.
      # runner-labels: '["sana-tests"]'
      # control-runner-labels: '["self-hosted"]'

  deploy:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Deploy
        run: bash scripts/deploy.sh   # деплой сайту як зараз (Sana, Rosteria — свій)

  # Необов'язково: PR із міткою «в прод», влитий у develop, одразу йде на прод
  # (якщо в develop немає нічого, крім нього). Прод-гілка без обов'язкових PR і перевірок.
  release-to-prod:
    needs: checks
    if: ${{ !cancelled() && github.ref_name == 'develop' && github.event_name == 'push' && needs.checks.result == 'success' }}
    uses: keykey-team/site-ci-kit/.github/workflows/release-to-prod.yml@v3.3.0
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write

  smoke-stage:
    needs: deploy
    if: github.ref_name == 'develop'
    uses: keykey-team/site-ci-kit/.github/workflows/smoke.yml@v3.3.0
    # statuses: write — smoke ставить коміту статус stage-smoke.
    permissions:
      contents: read
      statuses: write
    with:
      target-env: stage
      kit-ref: v3.3.0
    # secrets: inherit не працює між різними власниками (pucha02 → keykey-team),
    # тому секрети передаються явно.
    secrets:
      E2E_BASIC_AUTH_USER: ${{ secrets.E2E_BASIC_AUTH_USER }}
      E2E_BASIC_AUTH_PASSWORD: ${{ secrets.E2E_BASIC_AUTH_PASSWORD }}
      E2E_CUSTOMER_PHONE: ${{ secrets.E2E_CUSTOMER_PHONE }}
      E2E_CUSTOMER_OTP_CODE: ${{ secrets.E2E_CUSTOMER_OTP_CODE }}
      E2E_ADMIN_LOGIN: ${{ secrets.E2E_ADMIN_LOGIN }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # TEST_ORDER_TOKEN сервера stage: тестове замовлення й читання замовлення/залишку (06641).
      E2E_TEST_ORDER_TOKEN: ${{ secrets.E2E_STAGE_TEST_ORDER_TOKEN }}

  smoke-prod:
    needs: deploy
    if: github.ref_name == 'main'
    uses: keykey-team/site-ci-kit/.github/workflows/smoke.yml@v3.3.0
    # smoke.yml оголошує statuses: write (для stage); без цього дозволу тут
    # GitHub не запустить виклик навіть для проду.
    permissions:
      contents: read
      statuses: write
    with:
      target-env: prod
      kit-ref: v3.3.0
    # Прод відкритий, тести із записом туди не йдуть — крім тестового
    # замовлення (06641), якому потрібен TEST_ORDER_TOKEN сервера проду.
    secrets:
      E2E_TEST_ORDER_TOKEN: ${{ secrets.E2E_PROD_TEST_ORDER_TOKEN }}
